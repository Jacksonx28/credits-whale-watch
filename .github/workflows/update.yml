name: Update onchain dashboard
on:
  workflow_dispatch:
# Updates paused at Jackson's request until he explicitly asks to resume.
# Previous automatic triggers to restore on resumption:
#   schedule:
#     - cron: '17 * * * *'
#   push:
#     paths:
#       - scripts/**
#       - .github/workflows/update.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: onchain-snapshot
  cancel-in-progress: false
jobs:
  collect:
    if: ${{ false }} # Paused until the owner asks to resume.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect verified chain data
        run: python scripts/update.py
      - name: Publish snapshot
        run: |
          git config user.name "credits-whale-watch[bot]"
          git config user.email "credits-whale-watch[bot]@users.noreply.github.com"
          git add data/snapshot.json data/history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh verified Ethereum snapshot"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
